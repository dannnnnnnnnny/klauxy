name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Klauxy claims macOS and Linux support, so both are exercised. Node 20 is
    # the declared floor and 22 is the current LTS users are most likely on.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the published package installs and runs
        run: npm run verify:package

  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Homebrew formula parses
        run: ruby -c Formula/klauxy.rb
      - name: Check the installer script parses
        run: sh -n install.sh
